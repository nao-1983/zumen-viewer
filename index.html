<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPad ファイル選択テスト</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;padding:20px;background:#f0f0f0}
h2{margin-bottom:10px;font-size:16px}
.section{background:#fff;padding:16px;margin-bottom:16px;border-radius:10px}
button,label{
  display:inline-block;padding:14px 24px;margin:6px;
  background:#1A5F9E;color:#fff;border:none;border-radius:10px;
  font-size:16px;font-weight:600;cursor:pointer;
}
label{position:relative;overflow:hidden}
label input[type=file]{
  position:absolute;top:0;left:0;width:100%;height:100%;
  opacity:0;cursor:pointer;font-size:16px;
}
.result{margin-top:10px;padding:10px;background:#e8f0fb;border-radius:8px;font-size:14px;min-height:40px}
.success{background:#e6f4ec;color:#1a7a3c}
.error{background:#fdecea;color:#c0392b}
</style>
</head>
<body>

<h1 style="margin-bottom:20px">iPad ファイル選択テスト</h1>

<div class="section">
  <h2>テスト1: シンプルなlabel + input</h2>
  <label>
    PDFを選択
    <input type="file" accept="application/pdf" onchange="show('r1', this.files)">
  </label>
  <div class="result" id="r1">タップして試してください</div>
</div>

<div class="section">
  <h2>テスト2: ボタン + JS click()</h2>
  <button onclick="document.getElementById('test2').click()">PDFを選択（JS経由）</button>
  <input type="file" id="test2" accept="application/pdf" style="display:none" onchange="show('r2', this.files)">
  <div class="result" id="r2">タップして試してください</div>
</div>

<div class="section">
  <h2>テスト3: 表示されたinput直接</h2>
  <input type="file" accept="application/pdf" onchange="show('r3', this.files)" style="font-size:16px">
  <div class="result" id="r3">タップして試してください</div>
</div>

<div class="section">
  <h2>テスト4: accept指定なし</h2>
  <label>
    どんなファイルでも選択
    <input type="file" onchange="show('r4', this.files)">
  </label>
  <div class="result" id="r4">タップして試してください</div>
</div>

<div class="section">
  <h2>テスト5: .zumen ファイル</h2>
  <label>
    .zumen ファイルを選択
    <input type="file" accept=".zumen" onchange="show('r5', this.files)">
  </label>
  <div class="result" id="r5">タップして試してください</div>
</div>

<div class="section">
  <h2>環境情報</h2>
  <div class="result" id="env"></div>
</div>

<script>
function show(id, files){
  const el = document.getElementById(id);
  if(files && files.length > 0){
    el.className = 'result success';
    el.textContent = '✓ 成功: ' + files[0].name + ' (' + Math.round(files[0].size/1024) + ' KB)';
  } else {
    el.className = 'result error';
    el.textContent = '✗ ファイル未選択';
  }
}

document.getElementById('env').textContent = navigator.userAgent;
</script>

</body>
</html>
