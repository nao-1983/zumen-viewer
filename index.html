<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="図面ビューワー">
<title>図面シンボルビューワー</title>
<style>
:root{
  --bg:#F5F4F0;--surface:#FFFFFF;--surface2:#EEECEA;
  --border:#DDDBD3;--border2:#C0BDB5;
  --text:#1C1B18;--text2:#6B6960;--text3:#9B9A92;
  --accent:#C0392B;--accent-bg:#FDECEA;--accent-text:#8B2219;
  --info:#1A5F9E;--info-bg:#E8F0FB;--info-text:#1A5F9E;
  --green:#1A7A3C;--green-bg:#E6F4EC;
  --radius:10px;--radius-lg:16px;
  --font:'Helvetica Neue',Helvetica,'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1A1916;--surface:#242320;--surface2:#2E2D29;
  --border:#3A3934;--border2:#525048;
  --text:#F0EFE9;--text2:#9B9A92;--text3:#5A5950;
  --accent:#E05A4A;--accent-bg:#3A1A16;--accent-text:#F0A090;
  --info:#4A90D9;--info-bg:#162030;--info-text:#7ABAFF;
  --green:#2A9A4C;--green-bg:#0E2A18;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--text);font-size:15px;touch-action:none}

#app{display:flex;flex-direction:column;height:100dvh;height:100vh}

/* TOOLBAR */
#toolbar{
  display:flex;align-items:center;gap:6px;flex-shrink:0;
  padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));
  background:var(--surface);border-bottom:1px solid var(--border);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
#toolbar::-webkit-scrollbar{display:none}
#toolbar h1{font-size:14px;font-weight:700;white-space:nowrap;letter-spacing:-.3px;flex-shrink:0}
.sep{width:1px;height:20px;background:var(--border);flex-shrink:0;margin:0 2px}
.btn{
  font-size:12px;padding:6px 10px;border:1px solid var(--border2);
  background:var(--surface);color:var(--text);border-radius:8px;
  cursor:pointer;white-space:nowrap;flex-shrink:0;
  min-height:34px;display:flex;align-items:center;gap:4px;
  -webkit-user-select:none;user-select:none;font-family:var(--font)
}
.btn:active{background:var(--surface2);transform:scale(.96)}
.btn.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.btn.green{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.pinfo{font-size:12px;color:var(--text2);min-width:46px;text-align:center;white-space:nowrap;flex-shrink:0}

/* MAIN */
#main{display:flex;flex:1;overflow:hidden;position:relative}

/* CANVAS WRAP — handles scroll when not pinching */
#cw{
  flex:1;position:relative;overflow:hidden;background:#777;
  touch-action:none;/* we handle all touch manually */
}

/* PDF canvas inside a scalable container */
#cv-container{
  position:absolute;top:0;left:0;
  transform-origin:0 0;
  will-change:transform;
}
#pdf-canvas{display:block}

/* DROP ZONE */
#dz{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  background:var(--surface2);z-index:5;touch-action:auto;
}
#dz svg{opacity:.25}
#dz p{font-size:16px;color:var(--text2);font-weight:500}
#dz small{font-size:13px;color:var(--text3)}
#dz .btn{touch-action:auto;pointer-events:auto}

/* SIDEBAR */
#sb{
  width:230px;background:var(--surface);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;
  transition:transform .28s ease;
}
#sb.off{transform:translateX(100%);position:absolute;right:0;top:0;bottom:0;z-index:40;box-shadow:-6px 0 24px rgba(0,0,0,.18)}
#sb-head{padding:10px 12px;font-size:11px;font-weight:700;color:var(--text2);border-bottom:1px solid var(--border);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}
#sym-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:5px}
.si{padding:8px 10px;border-radius:var(--radius);cursor:pointer;border-bottom:1px solid var(--border)}
.si:last-child{border-bottom:none}
.si:active{background:var(--surface2)}
.si-name{font-size:13px;font-weight:500}
.si-sub{font-size:11px;color:var(--text2);margin-top:2px}
.si-fc{font-size:11px;color:var(--text3);margin-top:1px}

/* STATUS */
#status{
  padding:4px 12px;padding-bottom:max(4px,env(safe-area-inset-bottom));
  font-size:11px;color:var(--text2);background:var(--surface);border-top:1px solid var(--border);flex-shrink:0
}

/* PINS — positioned in screen coords */
.pin{position:absolute;transform:translate(-50%,-50%);z-index:20;pointer-events:auto}
.pdot{
  width:24px;height:24px;border-radius:50%;background:var(--accent);
  border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.35);
  cursor:pointer;transition:transform .12s;
  display:flex;align-items:center;justify-content:center
}
.pdot:active{transform:scale(1.25)}
.plabel{
  position:absolute;top:26px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.75);color:#fff;font-size:10px;
  padding:2px 7px;border-radius:4px;white-space:nowrap;
  pointer-events:none;opacity:0;transition:opacity .15s
}
.pin.showlabel .plabel{opacity:1}
.pin.open .plabel{opacity:0}

/* DROPDOWN */
.pdd{
  position:absolute;top:30px;left:50%;transform:translateX(-50%);
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);min-width:210px;max-width:280px;
  z-index:100;display:none;overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.22)
}
.pin.open .pdd{display:block}
.ddh{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.ddh-name{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddbadge{font-size:10px;padding:2px 6px;border-radius:20px;background:var(--info-bg);color:var(--info-text);white-space:nowrap;flex-shrink:0}
.ddi{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)}
.ddi:active{background:var(--surface2)}
.ddi-icon{flex-shrink:0;color:var(--text2)}
.ddi-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddempty{padding:10px 12px;font-size:12px;color:var(--text3)}
.ddedit{
  padding:10px 12px;font-size:12px;color:var(--info);
  background:var(--info-bg);cursor:pointer;display:flex;align-items:center;gap:6px;
  border-top:1px solid var(--border)
}
.ddedit:active{opacity:.7}

/* MODAL */
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center}
#ov.show{display:flex}
@media(min-width:600px){#ov{align-items:center}#emod{border-radius:var(--radius-lg);max-height:88vh}}
#emod{
  background:var(--surface);width:100%;max-width:540px;
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  max-height:92vh;display:flex;flex-direction:column;overflow:hidden
}
.mhandle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:10px auto 4px;flex-shrink:0}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.mtitle{font-size:15px;font-weight:600}
.mx{background:var(--surface2);border:none;cursor:pointer;font-size:15px;color:var(--text2);padding:6px 10px;border-radius:8px;min-width:36px;min-height:36px;font-family:var(--font)}
.mbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;letter-spacing:.05em;text-transform:uppercase}
.field input,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--radius);
  font-size:15px;background:var(--surface);color:var(--text);font-family:var(--font);
  -webkit-appearance:none;min-height:44px
}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--info);box-shadow:0 0 0 3px var(--info-bg)}
.field textarea{resize:vertical;min-height:80px}
.flist{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.frow{display:flex;align-items:center;gap:8px;padding:9px 10px;background:var(--surface2);border-radius:var(--radius);font-size:13px;border:1px solid var(--border)}
.frow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fdel{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;padding:2px 6px;min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center;font-family:var(--font)}
.fdel:active{color:var(--accent)}
.addfile{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--info);cursor:pointer;padding:10px 0;font-weight:500}
.addfile:active{opacity:.7}
.mfoot{display:flex;gap:8px;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--border);flex-shrink:0;background:var(--surface)}
.bsave{flex:1;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;min-height:44px;font-family:var(--font)}
.bsave:active{opacity:.85}
.bdel{padding:12px 14px;border:1px solid var(--accent);color:var(--accent);background:none;border-radius:var(--radius);font-size:15px;cursor:pointer;min-height:44px;font-family:var(--font)}
.bdel:active{background:var(--accent-bg)}

/* FILE VIEWER */
#fov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:300;flex-direction:column}
#fov.show{display:flex}
#fov-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));flex-shrink:0}
#fov-name{font-size:14px;color:#fff;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fov-x{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;min-height:40px;white-space:nowrap;font-family:var(--font)}
#fov-x:active{background:rgba(255,255,255,.3)}
#fov-body{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px}
#fov-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;display:none}
#fov-pdfw{width:100%;height:100%;display:none}
#fov-iframe{width:100%;height:100%;border:none;border-radius:8px}
#fov-msg{text-align:center;color:rgba(255,255,255,.6);font-size:14px;line-height:1.8;display:none}

/* TOAST */
#toast{
  position:fixed;bottom:70px;left:50%;transform:translateX(-50%);
  background:rgba(20,20,18,.92);color:#fff;font-size:13px;
  padding:9px 18px;border-radius:20px;z-index:500;
  opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap
}
#toast.show{opacity:1}

/* ZOOM INDICATOR */
#zindicator{
  position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.6);color:#fff;font-size:13px;font-weight:600;
  padding:5px 14px;border-radius:20px;pointer-events:none;
  opacity:0;transition:opacity .3s;z-index:30
}
#zindicator.show{opacity:1}

::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
</style>
</head>

<script>
'use strict';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ========== STATE ========== */
let pdfDoc=null, curPage=1, totalPages=1;
let pdfDataURL='';  // stores PDF as base64 for save/restore
let scale=1.0, minScale=0.3, maxScale=6.0;
let panX=0, panY=0;           // current pan offset
let placing=true;
let symbols=[];
let editId=null, editFiles=[];
let sbOpen=false;
let pdfFileName='';

/* ========== ELEMENTS ========== */
const cw=document.getElementById('cw');
const cvc=document.getElementById('cv-container');
const canvas=document.getElementById('pdf-canvas');
const ctx=canvas.getContext('2d');
const dz=document.getElementById('dz');
const statusEl=document.getElementById('status');

/* ========== TOAST ========== */
let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}
function st(m){statusEl.textContent=m}

/* ========== ZOOM INDICATOR ========== */
let zindT;
function showZind(){
  const el=document.getElementById('zindicator');
  el.textContent=Math.round(scale*100)+'%';
  el.classList.add('show');
  clearTimeout(zindT);
  zindT=setTimeout(()=>el.classList.remove('show'),1200);
  document.getElementById('zlabel').textContent=Math.round(scale*100)+'%';
}

/* ========== TRANSFORM ========== */
function applyTransform(){
  cvc.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;
  // reposition all pins
  document.querySelectorAll('.pin').forEach(el=>{
    const id=el.dataset.id;
    const s=symbols.find(x=>x.id===id);
    if(s) positionPin(el,s.x,s.y);
  });
}

function positionPin(el,cx,cy){
  // cx,cy are canvas-pixel coords; convert to screen coords in cw
  el.style.left=(cx*scale+panX)+'px';
  el.style.top=(cy*scale+panY)+'px';
}

function clampPan(){
  // allow some overscroll so canvas can be scrolled to any part
  const W=cw.clientWidth, H=cw.clientHeight;
  const cW=canvas.width*scale, cH=canvas.height*scale;
  const mx=Math.max(0,(cW-W)*0.5+W*0.1);
  const my=Math.max(0,(cH-H)*0.5+H*0.1);
  panX=Math.min(mx,Math.max(-mx+(W-cW>0?W-cW:0),panX));
  panY=Math.min(my,Math.max(-my+(H-cH>0?H-cH:0),panY));
}

function fitPage(){
  const W=cw.clientWidth, H=cw.clientHeight;
  if(!canvas.width||!canvas.height) return;
  scale=Math.min(W/canvas.width,H/canvas.height)*0.96;
  scale=Math.max(minScale,Math.min(maxScale,scale));
  panX=(W-canvas.width*scale)/2;
  panY=(H-canvas.height*scale)/2;
  applyTransform();
  showZind();
}

/* ========== PDF ========== */
async function loadPDF(file){
  try{
    pdfFileName=file.name;
    const ab=await file.arrayBuffer();
    // store as base64 for embedding in save file
    const bytes=new Uint8Array(ab);
    let bin='';for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
    pdfDataURL='data:application/pdf;base64,'+btoa(bin);
    pdfDoc=await pdfjsLib.getDocument({data:ab}).promise;
    totalPages=pdfDoc.numPages; curPage=1;
    dz.style.display='none';
    await renderPage(true);
    st(`「${file.name}」読込完了 — シンボル位置をタップして登録`);
  }catch(e){toast('PDFの読み込みに失敗しました');console.error(e)}
}

async function renderPage(fit=false){
  if(!pdfDoc) return;
  const pg=await pdfDoc.getPage(curPage);
  // render at 2x for retina; scale via CSS transform
  const baseVP=pg.getViewport({scale:2});
  canvas.width=baseVP.width; canvas.height=baseVP.height;
  canvas.style.width=baseVP.width+'px'; canvas.style.height=baseVP.height+'px';
  await pg.render({canvasContext:ctx,viewport:baseVP}).promise;
  document.getElementById('pinfo').textContent=`${curPage} / ${totalPages}`;
  if(fit) fitPage(); else applyTransform();
  renderAllPins();
}

/* ========== PINS ========== */
function renderAllPins(){
  document.querySelectorAll('.pin').forEach(e=>e.remove());
  symbols.filter(s=>s.pageNum===curPage).forEach(createPinEl);
}

function createPinEl(sym){
  const el=document.createElement('div');
  el.className='pin';
  el.dataset.id=sym.id;
  positionPin(el,sym.x,sym.y);

  const dot=document.createElement('div'); dot.className='pdot';
  const lbl=document.createElement('div'); lbl.className='plabel'; lbl.textContent=sym.name||'未設定';
  const dd=buildDD(sym);

  // iPad: touchend directly on dot (parent cw uses preventDefault so 'click' never fires on iOS)
  let dotTouchMoved=false;
  dot.addEventListener('touchstart',e=>{e.stopPropagation();dotTouchMoved=false;},{passive:true});
  dot.addEventListener('touchmove',()=>{dotTouchMoved=true;},{passive:true});
  dot.addEventListener('touchend',e=>{
    e.stopPropagation();e.preventDefault();
    if(dotTouchMoved)return;
    const was=el.classList.contains('open');
    closeDDs();
    if(!was){el.classList.add('open');el.classList.add('showlabel');}
  },{passive:false});
  // desktop fallback
  dot.addEventListener('click',e=>{
    e.stopPropagation();
    const was=el.classList.contains('open');
    closeDDs();
    if(!was){el.classList.add('open');el.classList.add('showlabel');}
  });

  el.appendChild(dot); el.appendChild(lbl); el.appendChild(dd);
  cw.appendChild(el);
  sym.el=el;
}

  ed.addEventListener('touchend',e=>{e.stopPropagation();e.preventDefault();if(!edMoved){openEdit(sym.id);closeDDs();}},{passive:false});

function ficon(mime){

  return `<svg ${a}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;

/* ========== TOUCH HANDLING ========== */
// Unified touch handler for: pan, pinch-zoom, tap-to-place
let touches={};
let gesture={type:null}; // 'pan','pinch','tap'
let tapTimer=null;

function getTwoFingerMid(t1,t2){
  return{x:(t1.clientX+t2.clientX)/2,y:(t1.clientY+t2.clientY)/2};
}
function dist2(t1,t2){
  return Math.hypot(t1.clientX-t2.clientX,t1.clientY-t2.clientY);
}

cw.addEventListener('touchstart',e=>{
  e.preventDefault();
  const ts=Array.from(e.touches);

  if(ts.length===1){
    gesture={
      type:'pending',
      startX:ts[0].clientX, startY:ts[0].clientY,
      lastX:ts[0].clientX, lastY:ts[0].clientY,
      moved:false, target:e.target
    };
  } else if(ts.length===2){
    closeDDs();
    gesture={
      type:'pinch',
      startDist:dist2(ts[0],ts[1]),
      startScale:scale,
      startMid:getTwoFingerMid(ts[0],ts[1]),
      startPanX:panX, startPanY:panY
    };
  }
},{passive:false});

cw.addEventListener('touchmove',e=>{
  e.preventDefault();
  const ts=Array.from(e.touches);

  if(gesture.type==='pinch'&&ts.length>=2){
    const d=dist2(ts[0],ts[1]);
    const newScale=Math.min(maxScale,Math.max(minScale,gesture.startScale*(d/gesture.startDist)));
    const mid=getTwoFingerMid(ts[0],ts[1]);
    // zoom around pinch midpoint
    const ratio=newScale/scale;
    panX=mid.x-(mid.x-panX)*ratio+(mid.x-gesture.startMid.x);
    panY=mid.y-(mid.y-panY)*ratio+(mid.y-gesture.startMid.y);
    scale=newScale;
    applyTransform();
    showZind();
    return;
  }

  if((gesture.type==='pending'||gesture.type==='pan')&&ts.length===1){
    const dx=ts[0].clientX-gesture.lastX;
    const dy=ts[0].clientY-gesture.lastY;
    const totalMoved=Math.hypot(ts[0].clientX-gesture.startX,ts[0].clientY-gesture.startY);
    if(totalMoved>10) gesture.moved=true;
    if(gesture.moved){
      gesture.type='pan';
      panX+=dx; panY+=dy;
      applyTransform();
    }
    gesture.lastX=ts[0].clientX;
    gesture.lastY=ts[0].clientY;
  }
},{passive:false});

cw.addEventListener('touchend',e=>{
  e.preventDefault();
  if(gesture.type==='pending'&&!gesture.moved){
    // TAP
    if(gesture.target.closest('.pin')) return;
    if(!pdfDoc||!placing) return;
    const r=cw.getBoundingClientRect();
    const screenX=gesture.startX-r.left;
    const screenY=gesture.startY-r.top;
    // convert screen coords to canvas coords
    const cx=(screenX-panX)/scale;
    const cy=(screenY-panY)/scale;
    if(cx<0||cy<0||cx>canvas.width||cy>canvas.height) return;
    placeSymbol(cx,cy);
  }
  if(gesture.type==='pinch'&&e.touches.length<2){
    // snap scale to render
    renderPage(false);
  }
  if(e.touches.length===0) gesture={type:null};
},{passive:false});

/* Mouse fallback (desktop) */
let mouseDown=false, mouseMoved=false, mouseStartX, mouseStartY, mouseLastX, mouseLastY;
cw.addEventListener('mousedown',e=>{
  if(e.button!==0) return;
  mouseDown=true; mouseMoved=false;
  mouseStartX=mouseLastX=e.clientX; mouseStartY=mouseLastY=e.clientY;
});
window.addEventListener('mousemove',e=>{
  if(!mouseDown) return;
  const dx=e.clientX-mouseLastX, dy=e.clientY-mouseLastY;
  if(Math.hypot(e.clientX-mouseStartX,e.clientY-mouseStartY)>4) mouseMoved=true;
  if(mouseMoved){panX+=dx;panY+=dy;applyTransform();}
  mouseLastX=e.clientX; mouseLastY=e.clientY;
});
window.addEventListener('mouseup',e=>{
  if(!mouseDown) return;
  mouseDown=false;
  if(!mouseMoved&&pdfDoc&&placing&&!e.target.closest('.pin')){
    const r=cw.getBoundingClientRect();
    const cx=(e.clientX-r.left-panX)/scale;
    const cy=(e.clientY-r.top-panY)/scale;
    if(cx>=0&&cy>=0&&cx<=canvas.width&&cy<=canvas.height) placeSymbol(cx,cy);
  }
});
cw.addEventListener('wheel',e=>{
  e.preventDefault();
  const delta=e.deltaY<0?1.1:0.9;
  const r=cw.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const ns=Math.min(maxScale,Math.max(minScale,scale*delta));
  panX=mx-(mx-panX)*(ns/scale);
  panY=my-(my-panY)*(ns/scale);
  scale=ns; applyTransform(); showZind();
},{passive:false});

/* ========== PLACE SYMBOL ========== */
function placeSymbol(cx,cy){
  const sym={id:Date.now()+'_'+Math.random().toString(36).slice(2),
    name:'',type:'',memo:'',files:[],x:cx,y:cy,pageNum:curPage,el:null};
  symbols.push(sym);
  createPinEl(sym);
  updateSB();
  openEdit(sym.id);
  st('シンボルを配置しました');
}

function buildSaveData(){
  return {version:3,pdfFileName,pdfDataURL,symbols:symbols.map(s=>({
    id:s.id,name:s.name,type:s.type,memo:s.memo,
    x:s.x,y:s.y,pageNum:s.pageNum,
    files:s.files.map(f=>({name:f.name,mime:f.mime,dataURL:f.dataURL}))
  }))};
}

function doSave(){
  if(symbols.length===0){toast('シンボルがありません');return;}
  const data=buildSaveData();
  const json=JSON.stringify(data);
  const fname=(pdfFileName.replace(/\.pdf$/i,'')||'zumen')+'.zumen';
  const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent);

  if(isIOS && navigator.share){
    // iOS: Web Share API でファイルアプリに直接保存
    const blob=new Blob([json],{type:'application/octet-stream'});
    const file=new File([blob],fname,{type:'application/octet-stream'});
    navigator.share({files:[file],title:fname})
      .then(()=>toast('「ファイル」アプリに保存してください'))
      .catch(err=>{
        if(err.name!=='AbortError') showSaveModal(json,fname);
      });
  } else {
    // PC / Android: 通常ダウンロード
    const blob=new Blob([json],{type:'application/octet-stream'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=fname;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast(`「${fname}」として保存しました`);
  }
}

async function loadFromJSON(json, label){
  try{
    const data=JSON.parse(json);
    if(!data.symbols) throw new Error('invalid');
    symbols=data.symbols.map(s=>({...s,el:null}));
    pdfFileName=data.pdfFileName||'';

    if(data.pdfDataURL){
      // PDF embedded — restore automatically
      st('PDFを復元中...');
      const b64=data.pdfDataURL.split(',')[1];
      const bin=atob(b64);
      const ab=new ArrayBuffer(bin.length);
      const ua=new Uint8Array(ab);
      for(let i=0;i<bin.length;i++) ua[i]=bin.charCodeAt(i);
      pdfDataURL=data.pdfDataURL;
      pdfDoc=await pdfjsLib.getDocument({data:ab}).promise;
      totalPages=pdfDoc.numPages; curPage=1;
      dz.style.display='none';
      await renderPage(true);
      toast(`${symbols.length}件のシンボルと図面を復元しました`);
      st(`「${pdfFileName}」を復元しました`);
    } else {
      // Old format without PDF — ask user to open PDF
      renderAllPins(); updateSB();
      toast(`${symbols.length}件のシンボルを読み込みました`);
      st(`シンボルを読み込みました — 「PDF」ボタンで同じ図面を開いてください`);
    }
  }catch(err){
    console.error(err);
    toast('読み込みに失敗しました — 正しいファイルか確認してください');
  }
}

      <div style="display:flex;gap:8px;">
        <button id="load-paste-btn" style="flex:1;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font)">貼り付けて読込</button>
        <button id="load-file-btn" style="flex:1;padding:13px;border:1px solid var(--border2);background:none;color:var(--text);border-radius:10px;font-size:14px;cursor:pointer;font-family:var(--font)">ファイルから選択</button>
      </div>
      <button id="load-close-btn" style="padding:10px;border:none;background:none;color:var(--text3);font-size:14px;cursor:pointer;font-family:var(--font)">閉じる</button>
    </div>`;
  document.body.appendChild(m);

  document.getElementById('load-paste-btn').addEventListener('click',()=>{
    const json=document.getElementById('load-paste').value.trim();
    if(!json){toast('データを貼り付けてください');return;}
    loadFromJSON(json,'貼り付けデータ');
    m.remove();
  });
  document.getElementById('load-file-btn').addEventListener('click',()=>{
    m.remove();
    document.getElementById('fin-proj').click();
  });
  document.getElementById('load-close-btn').addEventListener('click',()=>m.remove());
  m.addEventListener('click',e=>{if(e.target===m)m.remove()});
  // auto-focus textarea
  setTimeout(()=>document.getElementById('load-paste')?.focus(),300);
}

/* ========== TOOLBAR ========== */
document.getElementById('btn-pdf').addEventListener('click',()=>document.getElementById('fin-pdf').click());
document.getElementById('btn-pdf2').addEventListener('click',()=>document.getElementById('fin-pdf').click());
// iPad: btn-pdf2 inside #dz needs direct touch handling
document.getElementById('btn-pdf2').addEventListener('touchend',e=>{
  e.preventDefault();e.stopPropagation();
  document.getElementById('fin-pdf').click();
},{passive:false});
document.getElementById('btn-pdf').addEventListener('touchend',e=>{
  e.preventDefault();e.stopPropagation();
  document.getElementById('fin-pdf').click();
},{passive:false});
document.getElementById('fin-pdf').addEventListener('change',e=>{const f=e.target.files[0];if(f)loadPDF(f);e.target.value='';});

document.getElementById('btn-place').addEventListener('click',()=>{
  placing=!placing;
  const b=document.getElementById('btn-place');
  b.classList.toggle('on',placing);
  b.innerHTML=placing
    ?'<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>配置'
    :'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>閲覧';
  st(placing?'配置モード: シンボル位置をタップ':'閲覧モード: ピンをタップしてメニューを表示');
});

document.getElementById('btn-prev').addEventListener('click',async()=>{if(curPage>1){curPage--;await renderPage(true);}});
document.getElementById('btn-next').addEventListener('click',async()=>{if(curPage<totalPages){curPage++;await renderPage(true);}});

document.getElementById('btn-zi').addEventListener('click',()=>{
  if(scale>=maxScale) return;
  const cx=cw.clientWidth/2, cy=cw.clientHeight/2;
  const ns=Math.min(maxScale,+(scale*1.3).toFixed(2));
  panX=cx-(cx-panX)*(ns/scale); panY=cy-(cy-panY)*(ns/scale);
  scale=ns; applyTransform(); showZind();
});
document.getElementById('btn-zo').addEventListener('click',()=>{
  if(scale<=minScale) return;
  const cx=cw.clientWidth/2, cy=cw.clientHeight/2;
  const ns=Math.max(minScale,+(scale/1.3).toFixed(2));
  panX=cx-(cx-panX)*(ns/scale); panY=cy-(cy-panY)*(ns/scale);
  scale=ns; applyTransform(); showZind();
});
document.getElementById('btn-zfit').addEventListener('click',()=>{if(pdfDoc)fitPage()});

window.addEventListener('resize',()=>{if(pdfDoc)fitPage()});
</script>
